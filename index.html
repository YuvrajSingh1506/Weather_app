<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <h1>WEATHER APP</h1>


        <div class="tab-container">
            <p class="tab" data-yourWeather>Your Weather</p>

            <p class="tab" data-searchWeather>Search Weather</p>
        </div>

        <div class="weather-container">


                <!-- grant location container -->
                 <div class="sub-container grant-location-container">
                    <img src="Images/location.png" alt="" width="80" height="80" loading="lazy">
                    <p>Grant Location Access</p>
                    <p>Allow Access to Get Weather Information</p>
                    <button class="btn" data-grantAccess>Grant Access</button>
                 </div>

                    
                 <!-- search weather section -->
                 <form class="form-container" data-searchForm>
                    <input type="text" placeholder="Search for city..." data-searchInput>
                    <button class="btn" type="submit"><img src="Images/search.png" alt="" width="20" hight="20" loading="lazy"></button>
                 </form>


                 <!-- loading screen -->

                 <div class="sub-container loading-container">
                    <img src="Images/loading.gif" alt="" width="150" height="150">
                    <p>Loading</p>
                 </div>

                 <!-- weather info ui -->
                  <div class="sub-container user-info-container">
                        <div class="Name">
                            <p data-cityName></p>
                            <img data-countryIcon>
                        </div>
                        <p data-weatherDesc></p>
                        <img data-weatherIcon>
                        <p data-temp></p>
                        <div class="parameter-container">

                            <!-- card1 -->
                            <div class="parameter">
                                <img src="Images/wind.png" width="" height="">
                                <p>WindSpeed</p>
                                <p data-windspeed></p>
                            </div>

                             <div class="parameter">
                                <img src="Images/humidity.png" width="" height="">
                                <p>Humidity</p>
                                <p data-humidity></p>
                            </div>

                             <div class="parameter">
                                <img src="Images/cloud.png" width="" height="">
                                <p>Clouds</p>
                                <p data-cloudiness></p>
                            </div>
                        </div>
                  </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
